server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>.*), /orders$\{segment}
        - id: warehouse-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/inventory(?<segment>.*), /inventory$\{segment}
        - id: fleet-routing
          uri: http://localhost:8084
          predicates:
            - Path=/api/fleet/**
          filters:
            - RewritePath=/api/fleet(?<segment>.*), /fleet$\{segment}
        - id: payment-demo
          uri: http://localhost:8082
          predicates:
            - Path=/api/demo/**
          filters:
            - RewritePath=/api/demo(?<segment>.*), /demo$\{segment}
        - id: order-dlt
          uri: http://localhost:8081
          predicates:
            - Path=/api/dlt/**
          filters:
            - RewritePath=/api/dlt(?<segment>.*), /dlt$\{segment}
        - id: order-circuitbreakers
          uri: http://localhost:8081
          predicates:
            - Path=/api/actuator/circuitbreakers
          filters:
            - RewritePath=/api/actuator/circuitbreakers, /actuator/circuitbreakers

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n"
