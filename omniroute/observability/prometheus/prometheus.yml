global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order-service:8081"]

  - job_name: "warehouse-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["warehouse-service:8083"]

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["payment-service:8082"]

  - job_name: "fleet-routing"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["fleet-routing:8084"]

  - job_name: "fleet-routing-replica"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["fleet-routing-replica:8084"]

  - job_name: "fleet-routing-streams"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["fleet-routing-streams:8084"]

  - job_name: "telemetry-simulator"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["telemetry-simulator:8085"]

  - job_name: "gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8080"]
